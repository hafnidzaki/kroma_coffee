<body class="bg-oat-canvas text-espresso-charcoal font-body antialiased">
  <main class="min-h-[1024px] flex flex-col items-center justify-center px-gutter-lg py-section" data-stitch-vh="min-h-[1024px]===min-h-screen">

    <!-- Brand Mark -->
    <a href="kroma_homepage_id.html" class="flex items-center gap-gutter-sm mb-gutter-xl">
      <span class="w-3 h-3 rounded-full bg-warm-caramel" aria-hidden="true"></span>
      <span class="font-display text-headline-sm text-espresso-charcoal tracking-tight" data-design-text-token="headline-sm">KROMA COFFEE ROASTERS</span>
    </a>

    <!-- Centered Recovery Card -->
    <section class="w-full max-w-[460px] bg-light-surface-container-lowest border border-light-outline-variant rounded-lg p-gutter-xl flex flex-col gap-gutter-lg">
      <div class="flex flex-col items-start gap-gutter-md">
        <div class="w-14 h-14 rounded-full bg-light-surface-variant border border-warm-caramel flex items-center justify-center text-espresso-charcoal">
          <span class="material-symbols-outlined text-headline-md text-light-primary" aria-hidden="true">key</span>
        </div>
        <div class="flex flex-col gap-gutter-xs">
          <span class="font-mono text-mono-sm text-light-primary uppercase tracking-widest" data-design-text-token="mono-sm">PEMULIHAN AKUN</span>
          <h1 class="font-display text-headline-lg text-espresso-charcoal" data-design-text-token="headline-lg">Lupa Kata Sandi?</h1>
          <p class="font-body text-body-md text-light-on-surface-variant" data-design-text-token="body-md">
            Masukkan alamat email atau nomor WhatsApp terdaftar untuk menerima tautan pengaturan ulang kata sandi.
          </p>
        </div>
      </div>

      <form class="flex flex-col gap-gutter-md" onsubmit="event.preventDefault(); showKromaToast('Tautan pemulihan telah dikirim ke WhatsApp / Email Anda!'); setTimeout(() => { window.location.href = 'masuk_akun_kroma.html'; }, 1500);">
        <label class="flex flex-col gap-gutter-xs">
          <span class="font-label text-label-md text-espresso-charcoal" data-design-text-token="label-md">Email atau Nomor WhatsApp Terdaftar</span>
          <input type="text" placeholder="nama@email.com atau 0812xxxx" class="w-full px-gutter-md py-3 rounded border border-light-outline-variant bg-light-surface-container-lowest text-espresso-charcoal placeholder:text-light-on-surface-variant font-body text-body-md focus:border-espresso-charcoal focus:outline-none focus-visible:ring-2 focus-visible:ring-warm-caramel">
        </label>

        <!-- Info Notice -->
        <div class="bg-light-surface-container-low border border-light-outline-variant rounded-md p-gutter-md flex items-center gap-gutter-sm">
          <span class="material-symbols-outlined text-title-md text-light-primary shrink-0" aria-hidden="true">info</span>
          <span class="font-body text-body-sm text-espresso-charcoal" data-design-text-token="body-sm">Tautan reset berlaku 15 menit setelah dikirim ke kontak Anda.</span>
        </div>

        <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-3.5 rounded bg-espresso-charcoal text-oat-canvas hover:bg-light-primary transition-colors">
          <span class="font-label text-label-lg" data-design-text-token="label-lg">Kirim Tautan Pemulihan</span>
        </button>
      </form>

      <div class="pt-gutter-sm border-t border-light-outline-variant text-center">
        <a href="masuk_akun_kroma.html" class="inline-flex items-center gap-gutter-xs font-label text-label-md text-espresso-charcoal hover:text-light-primary transition-colors" data-design-text-token="label-md">
          <span>← Kembali ke Halaman Masuk</span>
        </a>
      </div>
    </section>
