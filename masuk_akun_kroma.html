<body class="bg-oat-canvas text-espresso-charcoal font-body antialiased">
  <main class="min-h-[1024px] flex flex-col items-center justify-center px-gutter-lg py-section" data-stitch-vh="min-h-[1024px]===min-h-screen">

    <!-- Brand Mark -->
    <a href="kroma_homepage_id.html" class="flex items-center gap-gutter-sm mb-gutter-xl">
      <span class="w-3 h-3 rounded-full bg-warm-caramel" aria-hidden="true"></span>
      <span class="font-display text-headline-sm text-espresso-charcoal tracking-tight" data-design-text-token="headline-sm">KROMA COFFEE ROASTERS</span>
    </a>

    <!-- Centered Auth Card -->
    <section class="w-full max-w-[460px] bg-light-surface-container-lowest border border-light-outline-variant rounded-lg p-gutter-xl flex flex-col gap-gutter-lg">
      <div class="flex flex-col gap-gutter-xs">
        <span class="font-mono text-mono-sm text-light-primary uppercase tracking-widest" data-design-text-token="mono-sm">MEMBER ROASTERY</span>
        <h1 class="font-display text-headline-lg text-espresso-charcoal" data-design-text-token="headline-lg">Masuk ke Akun Anda</h1>
        <p class="font-body text-body-md text-light-on-surface-variant" data-design-text-token="body-md">
          Kelola langganan kopi, lacak pengiriman, dan klaim poin roastery.
        </p>
      </div>

      <form class="flex flex-col gap-gutter-md" onsubmit="event.preventDefault(); showKromaToast('Berhasil masuk!'); setTimeout(() => { window.location.href = 'profil_riwayat_pesanan_id.html'; }, 600);">
        <!-- Email / WhatsApp -->
        <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-gutter-xs">
          <span class="font-label text-label-md text-espresso-charcoal" data-design-text-token="label-md">Email atau Nomor WhatsApp</span>
          <input type="text" placeholder="nama@email.com atau 0812xxxx" class="w-full px-gutter-md py-3 rounded border border-light-outline-variant bg-light-surface-container-lowest text-espresso-charcoal placeholder:text-light-on-surface-variant font-body text-body-md focus:border-espresso-charcoal focus:outline-none focus-visible:ring-2 focus-visible:ring-warm-caramel">
        </label>

        <!-- Password with Show/Hide Toggle -->
        <div class="flex flex-col gap-gutter-xs">
          <label for="login-password" class="font-label text-label-md text-espresso-charcoal" data-design-text-token="label-md">Kata Sandi</label>
          <div class="relative flex items-center">
            <input id="login-password" type="password" placeholder="Masukkan kata sandi" class="w-full pl-gutter-md pr-12 py-3 rounded border border-light-outline-variant bg-light-surface-container-lowest text-espresso-charcoal placeholder:text-light-on-surface-variant font-body text-body-md focus:border-espresso-charcoal focus:outline-none focus-visible:ring-2 focus-visible:ring-warm-caramel">
            <button id="toggle-login-pw" type="button" aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-3 inline-flex items-center justify-center w-8 h-8 rounded text-light-on-surface-variant hover:text-espresso-charcoal">
              <span class="material-symbols-outlined text-title-md" aria-hidden="true">visibility</span>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between gap-gutter-sm">
          <label class="inline-flex items-center gap-gutter-sm cursor-pointer">
            <input type="checkbox" checked class="rounded-sm border-light-outline text-espresso-charcoal focus:ring-warm-caramel">
            <span class="font-body text-body-md text-espresso-charcoal" data-design-text-token="body-md">Ingat saya</span>
          </label>
          <a href="lupa_kata_sandi.html" class="font-label text-label-md text-light-primary hover:underline" data-design-text-token="label-md">
            Lupa kata sandi?
          </a>
        </div>

        <!-- Primary CTA -->
        <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-3.5 rounded bg-espresso-charcoal text-oat-canvas hover:bg-light-primary transition-colors mt-gutter-xs">
          <span class="font-label text-label-lg" data-design-text-token="label-lg">Masuk Sekarang</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-gutter-md">
        <span class="flex-1 h-px bg-light-outline-variant" aria-hidden="true"></span>
        <span class="font-mono text-mono-sm text-light-on-surface-variant uppercase" data-design-text-token="mono-sm">Atau masuk dengan</span>
        <span class="flex-1 h-px bg-light-outline-variant" aria-hidden="true"></span>
      </div>

      <!-- Google & WhatsApp OTP -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-gutter-sm">
        <button type="button" class="inline-flex items-center justify-center gap-gutter-xs px-gutter-md py-2.5 rounded border border-light-outline-variant bg-light-surface-container-lowest text-espresso-charcoal hover:border-espresso-charcoal transition-colors">
          <span class="material-symbols-outlined text-title-md text-espresso-charcoal" aria-hidden="true">account_circle</span>
          <span class="font-label text-label-md" data-design-text-token="label-md">Google</span>
        </button>

        <button type="button" class="inline-flex items-center justify-center gap-gutter-xs px-gutter-md py-2.5 rounded border border-light-outline-variant bg-light-surface-container-lowest text-espresso-charcoal hover:border-espresso-charcoal transition-colors">
          <span class="material-symbols-outlined text-title-md text-success" aria-hidden="true">chat</span>
          <span class="font-label text-label-md" data-design-text-token="label-md">WhatsApp OTP</span>
        </button>
      </div>

      <!-- Footer Link -->
      <p class="text-center font-body text-body-md text-light-on-surface-variant pt-gutter-sm border-t border-light-outline-variant" data-design-text-token="body-md">
        Belum punya akun?
        <a href="daftar_akun_kroma.html" class="font-label text-label-md text-light-primary hover:underline">Daftar Akun Kroma</a>
      </p>
    </section>

  </main>

  <script>
    (function () {
      var btn = document.getElementById('toggle-login-pw');
      var input = document.getElementById('login-password');
      if (btn && input) {
        btn.addEventListener('click', function () {
          var isPw = input.type === 'password';
          input.type = isPw ? 'text' : 'password';
          var icon = btn.querySelector('.material-symbols-outlined');
          if (icon) icon.textContent = isPw ? 'visibility_off' : 'visibility';
        });
      }
    })();
  </script>



</body></html>
