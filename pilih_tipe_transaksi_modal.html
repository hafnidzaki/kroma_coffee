<body class="bg-light-surface-dim text-espresso-charcoal font-body antialiased selection:bg-warm-caramel selection:text-espresso-charcoal">
  <main class="min-h-[1024px] w-full bg-espresso-charcoal/70 flex items-center justify-center p-gutter-lg" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <section role="dialog" aria-modal="true" aria-labelledby="modal-title" class="w-full max-w-[520px] bg-light-surface-container-lowest border border-light-outline-variant rounded-lg overflow-hidden">
      <!-- 1. Modal Header -->
      <header class="flex items-center justify-between gap-gutter-md px-gutter-lg py-gutter-md border-b border-light-outline-variant bg-light-surface-container-lowest">
        <div class="flex flex-col gap-gutter-xs">
          <span class="font-mono text-mono-sm text-light-primary uppercase tracking-wider" data-design-text-token="mono-sm">KROMA COFFEE ROASTERS</span>
          <h1 id="modal-title" class="font-headline text-headline-md text-espresso-charcoal" data-design-text-token="headline-md">Pilih Cara Berbelanja</h1>
        </div>
        <a href="kroma_homepage_id.html" aria-label="Tutup modal" class="inline-flex items-center justify-center w-9 h-9 rounded border border-light-outline-variant bg-light-surface-container-low text-espresso-charcoal hover:border-espresso-charcoal hover:bg-light-surface-container transition-colors shrink-0">
          <span class="material-symbols-outlined text-title-lg" aria-hidden="true">close</span>
        </a>
      </header>

      <!-- Modal Body -->
      <form id="transaction-mode-form" class="p-gutter-lg flex flex-col gap-gutter-md">
        <!-- 2. Option 1: Kirim ke Alamat Saya -->
        <label id="card-delivery" for="opt-delivery" class="cursor-pointer rounded-md border-2 border-warm-caramel bg-light-surface-container-low p-gutter-md flex items-start gap-gutter-md transition-colors">
          <span class="inline-flex items-center justify-center w-11 h-11 rounded bg-light-surface-variant text-espresso-charcoal shrink-0">
            <span class="material-symbols-outlined text-headline-sm" aria-hidden="true">local_shipping</span>
          </span>
          <div class="flex-1 min-w-0 flex flex-col gap-gutter-xs">
            <div class="flex items-center justify-between gap-gutter-sm">
              <span class="font-title text-title-md text-espresso-charcoal" data-design-text-token="title-md">Kirim ke Alamat Saya</span>
              <input id="opt-delivery" type="radio" name="transaction_type" value="delivery" checked class="w-4 h-4 text-light-primary border-light-outline focus:outline-none focus-visible:ring-2 focus-visible:ring-warm-caramel">
            </div>
            <p class="font-body text-body-md text-light-on-surface-variant text-pretty" data-design-text-token="body-md">
              Dikirim langsung ke rumah via ekspedisi JNE, SiCepat, atau kurir instan GoSend/Grab.
            </p>
          </div>
        </label>

        <!-- 3. Option 2: Ambil di Toko (Click & Collect) -->
        <div id="card-pickup" class="rounded-md border border-light-outline-variant bg-light-surface-container-lowest p-gutter-md flex flex-col gap-gutter-md transition-colors">
          <label for="opt-pickup" class="cursor-pointer flex items-start gap-gutter-md">
            <span class="inline-flex items-center justify-center w-11 h-11 rounded bg-light-surface-container-low text-espresso-charcoal shrink-0">
              <span class="material-symbols-outlined text-headline-sm" aria-hidden="true">storefront</span>
            </span>
            <div class="flex-1 min-w-0 flex flex-col gap-gutter-xs">
              <div class="flex items-center justify-between gap-gutter-sm">
                <span class="font-title text-title-md text-espresso-charcoal" data-design-text-token="title-md">Ambil di Toko (Click &amp; Collect)</span>
                <input id="opt-pickup" type="radio" name="transaction_type" value="pickup" class="w-4 h-4 text-light-primary border-light-outline focus:outline-none focus-visible:ring-2 focus-visible:ring-warm-caramel">
              </div>
              <p class="font-body text-body-md text-light-on-surface-variant text-pretty" data-design-text-token="body-md">
                Pesan online, ambil sendiri di Experience Store terdekat. Tanpa ongkos kirim dan siap dalam 2 jam.
              </p>
            </div>
          </label>

          <!-- Store Selector Preview Dropdown -->
          <div class="pl-14 flex flex-col gap-gutter-xs">
            <label for="store-select" class="font-label text-label-md text-espresso-charcoal" data-design-text-token="label-md">
              Pilih Experience Store
            </label>
            <select id="store-select" name="store_location" class="w-full px-gutter-md py-2.5 rounded border border-light-outline-variant bg-light-surface-container-lowest text-espresso-charcoal font-body text-body-md focus:border-espresso-charcoal focus:outline-none focus-visible:ring-2 focus-visible:ring-warm-caramel">
              <option value="Kroma Senopati (Jakarta)">Kroma Senopati (Jakarta)</option>
              <option value="Kroma Dago (Bandung)">Kroma Dago (Bandung)</option>
              <option value="Kroma Gubeng (Surabaya)">Kroma Gubeng (Surabaya)</option>
              <option value="Kroma Kota Lama (Semarang)">Kroma Kota Lama (Semarang)</option>
            </select>
          </div>
        </div>

        <!-- Inline Saved Feedback -->
        <div id="preference-status" class="hidden rounded border border-success bg-light-surface-container-low px-gutter-md py-gutter-sm flex items-center gap-gutter-sm text-espresso-charcoal">
          <span class="material-symbols-outlined text-title-md text-success shrink-0" aria-hidden="true">check_circle</span>
          <span id="preference-status-text" class="font-body text-body-sm" data-design-text-token="body-sm"></span>
        </div>

        <!-- 4. Action Button -->
        <div class="pt-gutter-xs">
          <button type="submit" class="w-full py-3 px-gutter-lg rounded bg-warm-caramel text-espresso-charcoal hover:bg-espresso-charcoal hover:text-oat-canvas font-label text-label-lg transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-espresso-charcoal">
            <span data-design-text-token="label-lg">Simpan Preferensi Belanja</span>
          </button>
        </div>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const deliveryRadio = document.getElementById('opt-delivery');
      const pickupRadio = document.getElementById('opt-pickup');
      const cardDelivery = document.getElementById('card-delivery');
      const cardPickup = document.getElementById('card-pickup');
      const storeSelect = document.getElementById('store-select');
      const form = document.getElementById('transaction-mode-form');
      const statusBox = document.getElementById('preference-status');
      const statusText = document.getElementById('preference-status-text');

      function syncCardStyles() {
        if (deliveryRadio.checked) {
          cardDelivery.className = 'cursor-pointer rounded-md border-2 border-warm-caramel bg-light-surface-container-low p-gutter-md flex items-start gap-gutter-md transition-colors';
          cardPickup.className = 'rounded-md border border-light-outline-variant bg-light-surface-container-lowest p-gutter-md flex flex-col gap-gutter-md transition-colors';
        } else {
          cardDelivery.className = 'cursor-pointer rounded-md border border-light-outline-variant bg-light-surface-container-lowest p-gutter-md flex items-start gap-gutter-md transition-colors';
          cardPickup.className = 'rounded-md border-2 border-warm-caramel bg-light-surface-container-low p-gutter-md flex flex-col gap-gutter-md transition-colors';
        }
      }

      deliveryRadio.addEventListener('change', syncCardStyles);
      pickupRadio.addEventListener('change', syncCardStyles);

      storeSelect.addEventListener('change', function () {
        pickupRadio.checked = true;
        syncCardStyles();
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const sel = document.querySelector('input[name="transaction_type"]:checked')?.value || 'delivery';
        localStorage.setItem('kroma_fulfillment_mode', sel);
        showKromaToast('Preferensi belanja disimpan!');
        setTimeout(() => { window.location.href = 'kroma_homepage_id.html'; }, 800);
      
        event.preventDefault();
        const mode = deliveryRadio.checked ? 'delivery' : 'pickup';
        const store = storeSelect.value;
        try {
          localStorage.setItem('kroma_transaction_mode', mode);
          localStorage.setItem('kroma_pickup_store', store);
        } catch (err) {}

        statusText.textContent = mode === 'delivery'
          ? 'Preferensi disimpan: Kirim ke Alamat Saya.'
          : 'Preferensi disimpan: Ambil di ' + store + '.';
        statusBox.classList.remove('hidden');
      });
    })();
  </script>
